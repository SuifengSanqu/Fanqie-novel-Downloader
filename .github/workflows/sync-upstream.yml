name: Sync Upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "SuifengSanqu"
          git config user.email "monkeycode-ai@chaitin.com"

      - name: Add upstream and sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git remote add upstream https://github.com/POf-L/Fanqie-novel-Downloader.git
          git fetch --depth=1 upstream main

          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date, nothing to sync."
            exit 0
          fi

          git merge upstream/main --no-edit -X theirs --allow-unrelated-histories
          git push origin main